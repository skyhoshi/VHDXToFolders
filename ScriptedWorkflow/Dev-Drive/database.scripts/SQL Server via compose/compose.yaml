       #   source: X:\var\opt\mssql\secrets
       #   target: /var/opt/mssql/secrets
       # - type: bind
       #   source: ..\database-scripts\
       #   target: /var/opt/mssql/scripts

     #- 'C:\var\opt\mssql\.system:/var/opt/mssql/.system'
     #- '..\database-scripts\:\var\opt\mssql\scripts\'
     #- 'C:\var\opt\mssql\data:/var/opt/mssql/data'
     #- 'C:\var\opt\mssql\log:/var/opt/mssql/log'
     #- 'C:\var\opt\mssql\secrets:/var/opt/mssql/secrets'
