# Prerequisite: 
#   - Setup .env - take copy of .env_template and update settings
#   - Login to Azure. See https://fcsamerica.atlassian.net/wiki/spaces/KUB/pages/496042180/Container+Build+and+Run#Authenticating-with-Registry

# Run 
#   by being in the root directory 

# To Build:  docker compose build --no-cache lightningproxy.webapi.external
# To Build (if the build is missing) and start: docker compose up --force-recreate --detach lightningproxy.webapi.external
#  Note: The --force-recreate is only if you want to rebuild the image. Remove this to use an existing image.
# To stop:  docker compose down


version: '3.4'

services:
  sqlservice:
    container_name: sql-service
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    env_file: .env
    environment: 
      SA_PASSWORD: "change_this_password$!D"
      TZ: America/Chicago
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer # This is the default if none is specified.
    volumes: 
       - type: bind
         source: C:\var\opt\mssql\data
         target: /var/opt/mssql/data
       - type: bind
         source: C:\var\opt\mssql\log
         target: /var/opt/mssql/log
       - type: bind
         source: C:\var\opt\mssql\secrets
         target: /var/opt/mssql/secrets
       - type: bind
         source: .\..\..\database.scripts
         target: /var/opt/mssql/scripts

       # - type: bind
       #   source: X:\var\opt\mssql\data
       #   target: /var/opt/mssql/data
       # - type: bind
       #   source: X:\var\opt\mssql\log
       #   target: /var/opt/mssql/log
